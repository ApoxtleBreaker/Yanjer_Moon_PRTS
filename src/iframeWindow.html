<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src *;"> -->
  <title>Child Window</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .title-bar {
      position: fixed;
      z-index: 2;
      height: 30px;
      width: max-content;
      background: #4d4d4d43;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag; /* 允许拖动窗口 */
    }
    .title-bar button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      -webkit-app-region: no-drag; /* 按钮不可拖动 */
    }
    iframe {
      position: fixed;
      z-index: 1;
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <span>Custom Window</span>
    <div>
      <button onclick="window.electronAPI.minimizeWindow()">_</button>
      <button onclick="window.electronAPI.maximizeWindow()">□</button>
      <button onclick="window.electronAPI.closeWindow()">X</button>
    </div>
  </div>
  <iframe id="content-frame" src="https://live.bilibili.com/"></iframe>
  <!-- 测试: iframe 跨域 的cookie被禁止 -->
</body>
</html>
